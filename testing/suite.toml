# tcacomp testing suite registry — the 14-kernel corpus across 5 categories.
# Parsed by testing/orchestrator.py via stdlib tomllib. All fields are DATA:
# never interpolated into shell strings (fixed argv lists only). Dims mirror
# the in-runner baked constants; scalars mirror the runner-baked values
# (reporting mirrors — the runner sources hold the load-bearing values).
# Tolerances: reduce-carrying kernels 2e-3 (the proven frontend-matmul
# bound); tiny-K (<= 8 term) reduce + elementwise vocabulary 1e-5.
# bench_bytes = bytes moved per iteration: matmuls 4*(M*K + K*N + 2*M*N);
# the rank-3 fallback kernels report their actual moved bytes 4*(inputs +
# output).

suite = "tcacomp-testing"
version = 1

[[test]]
name = "dup_expr"
category = "dedup"
kernel = "testing/kernels/dedup/dup_expr.tca"
runner = "testing/runners/dup_expr.cu"
dims = [256, 256, 8]
tolerance = 1e-5
scalars = { gain = 1.5, bias = 0.25 }
bench_bytes = 2359296

